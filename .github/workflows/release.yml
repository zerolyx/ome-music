name: Release Windows Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish tagged Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        id: tauri_build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Ome Music ${{ github.ref_name }}"
          releaseBody: |
            # Ome Music ${{ github.ref_name }}

            轻量沉浸式 Windows 音乐播放器：本地音乐库、网易云登录与翻译歌词、播放列表、命令面板（Ctrl+K）、睡眠定时、DJ 模式，以及 Folia / ECHONext / Kimi 风格的前沿视觉设计。

            ## 下载

            - `Ome-Music_*_x64-setup.exe`（Windows 10/11 64 位，安装时按需下载 WebView2 运行库）

            这是未签名的开发构建，首次打开时 Windows SmartScreen 可能显示警告，点「仍要运行」即可。

            ## 完整性校验

            每个产物的 SHA256 见工作流日志中 "Generate SHA256 checksums" 步骤的输出。

            ## 说明

            - 会员曲目仅通过你自己登录的会话请求，Ome Music 不绕过平台访问规则。
            - 会话信息只保存在本机，切勿提交到仓库。
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc

      - name: Build Windows installer artifact
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: npm run tauri -- build --target x86_64-pc-windows-msvc

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          if (-not (Test-Path $bundleRoot)) {
            $bundleRoot = "src-tauri/target/release/bundle"
          }
          Write-Host "Scanning $bundleRoot for release artifacts..."
          $artifacts = Get-ChildItem -Path $bundleRoot -Recurse -File -Include "*.exe","*.msi"
          if ($artifacts.Count -eq 0) {
            Write-Warning "No installer artifacts found under $bundleRoot; skipping checksum generation."
            return
          }
          $checksumFile = "sha256-checksums.txt"
          foreach ($artifact in $artifacts) {
            $hash = (Get-FileHash -Algorithm SHA256 -Path $artifact.FullName).Hash.ToLower()
            "$hash  $($artifact.Name)" | Out-File -FilePath $checksumFile -Append -Encoding UTF8
            Write-Host "$hash  $($artifact.FullName)"
          }
          Write-Host "::notice::SHA256 checksums written to $checksumFile"

      - name: Upload checksum artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-sha256-checksums
          path: sha256-checksums.txt
          if-no-files-found: ignore

      - name: Upload manual build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ome-music-windows-manual-build
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: error
