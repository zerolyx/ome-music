[package]
name = "ome-music-player"
version = "0.4.0"
description = "Local-first private music player desktop app"
authors = ["Ome"]
license = "MIT"
edition = "2021"

[lib]
name = "ome_music_player_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
lofty = "0.24"
base64 = "0.22"
md5 = "0.7"
urlencoding = "2"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
rsa = "0.9"
rand = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
tokio = { version = "1", features = ["time", "sync"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
opt-level = "z"
